# this file uses prebuilt image in dockerhub
services:
  jekyll:
    image: amirpourmand/al-folio:v0.14.6
    entrypoint: ["/bin/bash", "-lc"]
    command:
      - |
        bundle install &&
        exec bundle exec jekyll serve \
          --watch \
          --port=8080 \
          --host=0.0.0.0 \
          --livereload \
          --force_polling
    ports:
      - 8080:8080
      - 35729:35729
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
